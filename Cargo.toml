[package]
name = "dcmview"
version = "0.4.1"
edition.workspace = true
rust-version.workspace = true
build = "build.rs"
description = "Fast temporary DICOM viewer for local and remote research workflows"
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["dicom", "medical-imaging", "viewer", "research"]
categories = ["command-line-utilities", "science", "visualization"]

# The root package stays the `dcmview` binary and library, so `cargo build`,
# `cargo install --path .`, the wheel build and the VS Code packaging all keep
# their paths. Member crates hold what other crates and repositories may
# depend on without the viewer.
#
# Shared here: edition, MSRV, license and project URLs. Not shared: `version`.
# The root `[package].version` above stays a literal because release tooling
# reads it from this file; every member repeats the same value and
# `scripts/check_versions.py` rejects drift. Members share the viewer's
# version because other repositories pin them by dcmview release tag, so the
# tag is the only version a consumer selects. Wire compatibility is carried by
# the `protocol` integer, not by this number.
#
# No `[workspace.lints]`: the lint policy is `clippy --workspace -D warnings`
# in `scripts/check.py`, the same for every member.
[workspace]
members = ["crates/dcmview-annotation", "crates/dcmview-protocol"]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/dcmview/dcmview"
homepage = "https://github.com/dcmview/dcmview"

[features]
default = []
debug-api = []
debug-embed = ["rust-embed/debug-embed"]
remote-fixtures = ["dep:dicom-test-files"]

[dependencies]
# Launch and startup contract, re-exported by src/api/contracts.rs
dcmview-protocol = { path = "crates/dcmview-protocol" }
# File keys (`FileKey`, `KEY_RULES`); the rest of the model is not used here
dcmview-annotation = { path = "crates/dcmview-annotation" }
# Whole-file digests behind `b3:` file keys (docs/design/annotation-model.md
# 1.3). CC0-1.0 OR Apache-2.0. `std` only: no memory mapping and no rayon,
# because a file is hashed in bounded slices on the blocking pool. The crate
# builds its SIMD code with `cc`, the compiler the JPEG-LS decoder needs.
blake3 = { version = "1.8", default-features = false, features = ["std"] }

# DICOM
dicom-object = "0.10.0"
dicom-core = "0.10.0"
dicom-encoding = "0.10.0"
dicom-dictionary-std = "0.10.0"
dicom-parser = "0.10.0"
dicom-transfer-syntax-registry = "0.10.0"
dicom-pixeldata = { version = "0.10.0", features = ["charls", "image", "jpegxl", "native", "openjp2"] }

# Web server
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tower = "0.5"
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "trace"] }

# Asset embedding
rust-embed = { version = "8", features = ["axum"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# Image encoding, and the raster formats discovery recognizes. The codecs are
# named here so they do not depend on another crate's default features; `png`
# and `tiff` are the versions `image` already links, used directly for
# header-only reads (docs/design/image-formats.md section 4).
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
png = "0.17"
tiff = "0.9"
flate2 = "1.1"
jpeg2k = { version = "0.10", default-features = false, features = ["openjp2"] }
# The JPEG XL decoder dicom-pixeldata already links, named so that frames are
# decoded under its allocation limit (docs/architecture.md, "Compressed
# Frames Are Held To The Header").
jxl-oxide = { version = "0.12.6", default-features = false }

# CLI
clap = { version = "4", features = ["derive"] }

# Cache
lru = "0.16"

# Parallel file discovery
rayon = "1"
walkdir = "2"

# Browser open
open = "5"

# Utilities
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
dicom-test-files = { version = "0.4", optional = true }
libc = "0.2"
# Access token: OS randomness, URL-safe encoding, constant-time comparison
getrandom = "0.3"
base64 = "0.22"
subtle = "2"
ts-rs = "12"

[build-dependencies]
sha2 = "0.10"


[dev-dependencies]
tempfile = "3"
axum-test = "19"
tokio = { version = "1", features = ["test-util"] }

# charls-sys builds its bundled C++ library with CMake. An unoptimized MSVC
# build selects the debug CRT, which is incompatible with Rust's test binaries.
[profile.dev.package.charls-sys]
opt-level = 1

[profile.test.package.charls-sys]
opt-level = 1

# Shipped binaries: about half the size and slightly faster frame paths, at
# the cost of a slower release build. Never set panic = "abort": the API
# relies on a panicking blocking task surfacing as a JoinError (HTTP 500)
# while the server keeps running.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true
