[package]
name = "dcmview"
version = "0.2.13"
edition = "2021"
rust-version = "1.88"
build = "build.rs"
description = "Fast temporary DICOM viewer for local and remote research workflows"
license = "MIT"
repository = "https://github.com/dcmview/dcmview"
homepage = "https://github.com/dcmview/dcmview"
readme = "README.md"
keywords = ["dicom", "medical-imaging", "viewer", "research"]
categories = ["command-line-utilities", "science", "visualization"]

[features]
default = []
debug-api = []
debug-embed = ["rust-embed/debug-embed"]
remote-fixtures = ["dep:dicom-test-files"]

[dependencies]
# DICOM
dicom-object = "0.9.1"
dicom-core = "0.9.1"
dicom-encoding = "0.9.1"
dicom-dictionary-std = "0.9"
dicom-pixeldata = { version = "0.9.1", features = ["charls", "image", "jpegxl", "native", "openjp2"] }

# Web server
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# Asset embedding
rust-embed = { version = "8", features = ["axum"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# Image encoding
image = "0.25"
flate2 = "1.1"
jpeg2k = { version = "0.10", default-features = false, features = ["openjp2"] }

# CLI
clap = { version = "4", features = ["derive"] }

# Cache
lru = "0.16"

# Parallel file discovery
rayon = "1"
walkdir = "2"

# Browser open
open = "5"

# Utilities
bytes = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["clock"] }
futures = "0.3"
urlencoding = "2"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
dicom-test-files = { version = "0.4", optional = true }
libc = "0.2"

[build-dependencies]
sha2 = "0.10"


[dev-dependencies]
tempfile = "3"
axum-test = "19"
tokio = { version = "1", features = ["test-util"] }

# charls-sys builds its bundled C++ library with CMake. An unoptimized MSVC
# build selects the debug CRT, which is incompatible with Rust's test binaries.
[profile.dev.package.charls-sys]
opt-level = 1

[profile.test.package.charls-sys]
opt-level = 1
