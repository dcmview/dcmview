name: Compatibility

# Manual only: runs the HTTP compatibility campaign against the producer
# artifact pinned in scripts/compatibility/corpus-artifact.json. To try a new
# artifact, update the pin on a branch and dispatch this workflow on that branch.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stored-corpus:
    name: Stored corpus compatibility smoke
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Download the pinned corpus artifact
        env:
          TOKEN: ${{ secrets.DCMVIEW_COMPAT_CORPUS_TOKEN }}
          PIN: scripts/compatibility/corpus-artifact.json
        shell: bash
        run: |
          set -euo pipefail
          repository=$(jq -r .repository "$PIN")
          artifact_id=$(jq -r .artifact_id "$PIN")
          digest=$(jq -r .zip_sha256 "$PIN")
          if [[ "$artifact_id" == null || "$digest" == null ]]; then
            echo "::error file=$PIN::No corpus artifact is pinned yet"
            exit 1
          fi
          if [[ -z "$TOKEN" ]]; then
            echo "::error::DCMVIEW_COMPAT_CORPUS_TOKEN is not available to this run"
            exit 1
          fi
          zip="$RUNNER_TEMP/corpus.zip"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/$repository/actions/artifacts/$artifact_id/zip" \
            --output "$zip"
          echo "${digest#sha256:}  $zip" | sha256sum --check --strict
          unzip -q "$zip" -d "$RUNNER_TEMP/corpus"
      - name: Run the stored-artifact compatibility profile
        env:
          DCMVIEW_COMPAT_CORPUS_ROOT: ${{ runner.temp }}/corpus
          DCMVIEW_COMPAT_OUTPUT: ${{ runner.temp }}/compatibility-evidence
        run: python scripts/check.py compatibility-artifact --install
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcmview-compatibility-${{ github.run_id }}
          path: ${{ runner.temp }}/compatibility-evidence
          if-no-files-found: ignore
