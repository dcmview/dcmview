name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  changes:
    name: Packaging change detection
    runs-on: ubuntu-22.04
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packaging:
              - ".github/workflows/**"
              - "Cargo.lock"
              - "Cargo.toml"
              - "LICENSE"
              - "README.md"
              - "build.rs"
              - "crates/**"
              - "frontend/**"
              - "pyproject.toml"
              - "setup.py"
              - "python/**"
              - "scripts/**"
              - "src/**"

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check package versions
        run: python scripts/check_versions.py
      - name: Run frontend checks
        run: python scripts/check.py frontend --install

  rust:
    name: Rust lint and tests (Linux, Rust 1.88)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust formatting, lint, fixture, and test checks
        run: python scripts/check.py rust --install

  rust-platform:
    name: Rust tests (${{ matrix.runner }}, Rust 1.88)
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust fixture and test checks
        run: python scripts/check.py rust-test --install

  python-unit:
    name: Python unit (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.x"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python unit tests
        run: python scripts/check.py python-unit

  python-integration:
    name: Python real-binary integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run wrapper and HTTP smoke tests against a real binary
        run: python scripts/check.py python-integration --install

  vscode-compile:
    name: VS Code compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile the VS Code extension
        run: python scripts/check.py vscode --install

  vscode-integration:
    name: VS Code integration (${{ matrix.vscode-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode-version: "1.90.2"
            experimental: false
          - vscode-version: "insiders"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run VS Code extension integration
        env:
          DCMVIEW_VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a python scripts/check.py vscode-integration --install

  packaging-smoke:
    name: Python wheel packaging
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build manylinux wheel
        run: bash scripts/build_linux_wheel.sh
      - name: Verify wheel name and installed CLI
        run: >
          python scripts/verify_wheel_install.py
          dist
          --expected-platform manylinux_2_28_x86_64
