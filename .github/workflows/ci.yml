name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      corpus_artifact_url:
        description: HTTPS URL for a tarred current smoke artifact
        required: true
        type: string
      corpus_artifact_sha256:
        description: SHA-256 of the downloaded artifact archive
        required: true
        type: string
      corpus_manifest_sha256:
        description: SHA-256 of the artifact manifest.json
        required: true
        type: string
      corpus_definition_sha256:
        description: SHA-256 of identity_projection.corpus_definition.identity
        required: true
        type: string
      corpus_generator_version:
        description: Expected synth-dicom-gen version recorded by the artifact
        required: true
        type: string
      corpus_generator_features:
        description: Comma-separated expected generator feature flags (empty when none)
        required: false
        default: ""
        type: string

jobs:
  changes:
    name: Packaging change detection
    runs-on: ubuntu-22.04
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packaging:
              - ".github/workflows/**"
              - "Cargo.lock"
              - "Cargo.toml"
              - "LICENSE"
              - "README.md"
              - "build.rs"
              - "frontend/**"
              - "pyproject.toml"
              - "setup.py"
              - "python/**"
              - "scripts/**"
              - "src/**"

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check package versions
        run: python scripts/check_versions.py
      - name: Run frontend checks
        run: python scripts/check.py frontend --install

  rust:
    name: Rust lint and tests (Linux, Rust 1.88)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust formatting, lint, fixture, and test checks
        run: python scripts/check.py rust --install

  rust-platform:
    name: Rust tests (${{ matrix.runner }}, Rust 1.88)
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust fixture and test checks
        run: python scripts/check.py rust-test --install

  python-unit:
    name: Python unit (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.x"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python unit tests
        run: python scripts/check.py python-unit

  python-integration:
    name: Python real-binary integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run wrapper and HTTP smoke tests against a real binary
        run: python scripts/check.py python-integration --install

  compatibility-artifact:
    name: Stored current corpus compatibility smoke
    if: >-
      ${{
        (github.event_name == 'workflow_dispatch' &&
          inputs.corpus_artifact_url != '' &&
          inputs.corpus_artifact_sha256 != '' &&
          inputs.corpus_manifest_sha256 != '' &&
          inputs.corpus_definition_sha256 != '' &&
          inputs.corpus_generator_version != '') ||
        (vars.DCMVIEW_COMPAT_CORPUS_ARTIFACT_URL != '' &&
          vars.DCMVIEW_COMPAT_CORPUS_ARTIFACT_SHA256 != '' &&
          vars.DCMVIEW_COMPAT_CORPUS_MANIFEST_SHA256 != '' &&
          vars.DCMVIEW_COMPAT_CORPUS_DEFINITION_SHA256 != '' &&
          vars.DCMVIEW_COMPAT_CORPUS_GENERATOR_VERSION != '')
      }}
    runs-on: ubuntu-22.04
    env:
      DCMVIEW_CORPUS_ARTIFACT_URL: ${{ inputs.corpus_artifact_url || vars.DCMVIEW_COMPAT_CORPUS_ARTIFACT_URL }}
      DCMVIEW_CORPUS_ARTIFACT_SHA256: ${{ inputs.corpus_artifact_sha256 || vars.DCMVIEW_COMPAT_CORPUS_ARTIFACT_SHA256 }}
      DCMVIEW_CORPUS_MANIFEST_SHA256: ${{ inputs.corpus_manifest_sha256 || vars.DCMVIEW_COMPAT_CORPUS_MANIFEST_SHA256 }}
      DCMVIEW_CORPUS_DEFINITION_SHA256: ${{ inputs.corpus_definition_sha256 || vars.DCMVIEW_COMPAT_CORPUS_DEFINITION_SHA256 }}
      DCMVIEW_CORPUS_GENERATOR_VERSION: ${{ inputs.corpus_generator_version || vars.DCMVIEW_COMPAT_CORPUS_GENERATOR_VERSION }}
      DCMVIEW_CORPUS_GENERATOR_FEATURES: ${{ inputs.corpus_generator_features || vars.DCMVIEW_COMPAT_CORPUS_GENERATOR_FEATURES }}
      DCMVIEW_CORPUS_ARTIFACT_TOKEN: ${{ secrets.DCMVIEW_COMPAT_CORPUS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Download and authenticate the stored smoke artifact
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/dcmview-current-smoke.tar.gz"
          if [[ -n "${DCMVIEW_CORPUS_ARTIFACT_TOKEN:-}" ]]; then
            curl --fail --location --silent --show-error \
              --header "Authorization: Bearer ${DCMVIEW_CORPUS_ARTIFACT_TOKEN}" \
              "$DCMVIEW_CORPUS_ARTIFACT_URL" --output "$archive"
          else
            curl --fail --location --silent --show-error \
              "$DCMVIEW_CORPUS_ARTIFACT_URL" --output "$archive"
          fi
          echo "$DCMVIEW_CORPUS_ARTIFACT_SHA256  $archive" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/dcmview-current-smoke"
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP/dcmview-current-smoke"
          test -f "$RUNNER_TEMP/dcmview-current-smoke/smoke/manifest.json"
      - name: Run the viewer-owned stored-artifact profile
        env:
          DCMVIEW_COMPAT_CORPUS_ROOT: ${{ runner.temp }}/dcmview-current-smoke/smoke
          DCMVIEW_COMPAT_OUTPUT: ${{ runner.temp }}/dcmview-compatibility-artifact
        run: python scripts/check.py compatibility-artifact --install
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcmview-compatibility-artifact-${{ github.run_id }}
          path: ${{ runner.temp }}/dcmview-compatibility-artifact
          if-no-files-found: ignore

  vscode-compile:
    name: VS Code compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile the VS Code extension
        run: python scripts/check.py vscode --install

  vscode-integration:
    name: VS Code integration (${{ matrix.vscode-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode-version: "1.90.2"
            experimental: false
          - vscode-version: "insiders"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run VS Code extension integration
        env:
          DCMVIEW_VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a python scripts/check.py vscode-integration --install

  packaging-smoke:
    name: Python wheel packaging
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build manylinux wheel
        run: bash scripts/build_linux_wheel.sh
      - name: Verify wheel name and installed CLI
        run: >
          python scripts/verify_wheel_install.py
          dist
          --expected-platform manylinux_2_28_x86_64
