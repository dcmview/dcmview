name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
    inputs:
      corpus_artifact_repository: {description: Immutable producer repository, required: true, type: string}
      corpus_artifact_workflow: {description: Immutable producer workflow file, required: true, type: string}
      corpus_artifact_run_id: {description: Numeric producer workflow run ID, required: true, type: string}
      corpus_artifact_id: {description: Numeric upload-artifact ID, required: true, type: string}
      corpus_artifact_digest: {description: SHA-256 digest of the downloaded Actions artifact ZIP, required: true, type: string}
      corpus_generator_revision: {description: Generator source revision in artifact-index.json, required: true, type: string}
      corpus_actions_zip_sha256: {description: Generator Actions ZIP SHA-256 in artifact-index.json, required: true, type: string}
      corpus_actions_zip_size_bytes: {description: Generator Actions ZIP size in artifact-index.json, required: true, type: string}
      corpus_nested_archive_sha256: {description: Generator nested archive SHA-256 in artifact-index.json, required: true, type: string}
      corpus_nested_archive_size_bytes: {description: Generator nested archive size in artifact-index.json, required: true, type: string}
      corpus_release_manifest_sha256: {description: Generator release manifest SHA-256 in artifact-index.json, required: true, type: string}
      corpus_release_manifest_size_bytes: {description: Generator release manifest size in artifact-index.json, required: true, type: string}
      corpus_installed_binary_sha256: {description: Installed generator binary SHA-256 in artifact-index.json, required: true, type: string}
      corpus_installed_binary_size_bytes: {description: Installed generator binary size in artifact-index.json, required: true, type: string}
      corpus_generator_target: {description: Generator target in artifact-index.json, required: true, type: string}
      corpus_generator_toolchain: {description: Generator Rust toolchain in artifact-index.json, required: true, type: string}
      corpus_generator_features: {description: Comma-separated generator feature flags (empty when none), required: true, type: string}
      corpus_runtime_identities_sha256: {description: SHA-256 of canonical runtime_identities, required: true, type: string}
      corpus_definition_manifest_sha256: {description: Corpus definition manifest SHA-256, required: true, type: string}
      corpus_definition_sha256: {description: Corpus definition identity SHA-256, required: true, type: string}
      corpus_manifest_sha256: {description: Generated manifest SHA-256, required: true, type: string}
      corpus_manifest_size_bytes: {description: Generated manifest size in bytes, required: true, type: string}
      corpus_profile: {description: Generated profile, required: true, type: string}
      corpus_seed: {description: Generated seed, required: true, type: string}
      corpus_binding_id: {description: Producer binding ID, required: true, type: string}
      corpus_archive_sha256: {description: Deterministic smoke.tar.gz SHA-256, required: true, type: string}
      corpus_archive_size_bytes: {description: Deterministic smoke.tar.gz size in bytes, required: true, type: string}
      corpus_generator_version: {description: Generator product version, required: true, type: string}

jobs:
  changes:
    name: Packaging change detection
    runs-on: ubuntu-22.04
    outputs:
      packaging: ${{ steps.filter.outputs.packaging }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            packaging:
              - ".github/workflows/**"
              - "Cargo.lock"
              - "Cargo.toml"
              - "LICENSE"
              - "README.md"
              - "build.rs"
              - "frontend/**"
              - "pyproject.toml"
              - "setup.py"
              - "python/**"
              - "scripts/**"
              - "src/**"

  frontend:
    name: Frontend
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check package versions
        run: python scripts/check_versions.py
      - name: Run frontend checks
        run: python scripts/check.py frontend --install

  rust:
    name: Rust lint and tests (Linux, Rust 1.88)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust formatting, lint, fixture, and test checks
        run: python scripts/check.py rust --install

  rust-platform:
    name: Rust tests (${{ matrix.runner }}, Rust 1.88)
    strategy:
      fail-fast: false
      matrix:
        runner:
          - windows-latest
          - macos-14
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run Rust fixture and test checks
        run: python scripts/check.py rust-test --install

  python-unit:
    name: Python unit (${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.9"
          - "3.x"
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run Python unit tests
        run: python scripts/check.py python-unit

  python-integration:
    name: Python real-binary integration
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Run wrapper and HTTP smoke tests against a real binary
        run: python scripts/check.py python-integration --install

  compatibility-artifact:
    name: Stored current corpus compatibility smoke
    runs-on: ubuntu-22.04
    env:
      DCMVIEW_CORPUS_ARTIFACT_REPOSITORY: ${{ inputs.corpus_artifact_repository || vars.DCMVIEW_CORPUS_ARTIFACT_REPOSITORY }}
      DCMVIEW_CORPUS_ARTIFACT_WORKFLOW: ${{ inputs.corpus_artifact_workflow || vars.DCMVIEW_CORPUS_ARTIFACT_WORKFLOW }}
      DCMVIEW_CORPUS_ARTIFACT_RUN_ID: ${{ inputs.corpus_artifact_run_id || vars.DCMVIEW_CORPUS_ARTIFACT_RUN_ID }}
      DCMVIEW_CORPUS_ARTIFACT_ID: ${{ inputs.corpus_artifact_id || vars.DCMVIEW_CORPUS_ARTIFACT_ID }}
      DCMVIEW_CORPUS_ARTIFACT_DIGEST: ${{ inputs.corpus_artifact_digest || vars.DCMVIEW_CORPUS_ARTIFACT_DIGEST }}
      DCMVIEW_CORPUS_GENERATOR_REVISION: ${{ inputs.corpus_generator_revision || vars.DCMVIEW_CORPUS_GENERATOR_REVISION }}
      DCMVIEW_CORPUS_ACTIONS_ZIP_SHA256: ${{ inputs.corpus_actions_zip_sha256 || vars.DCMVIEW_CORPUS_ACTIONS_ZIP_SHA256 }}
      DCMVIEW_CORPUS_ACTIONS_ZIP_SIZE_BYTES: ${{ inputs.corpus_actions_zip_size_bytes || vars.DCMVIEW_CORPUS_ACTIONS_ZIP_SIZE_BYTES }}
      DCMVIEW_CORPUS_NESTED_ARCHIVE_SHA256: ${{ inputs.corpus_nested_archive_sha256 || vars.DCMVIEW_CORPUS_NESTED_ARCHIVE_SHA256 }}
      DCMVIEW_CORPUS_NESTED_ARCHIVE_SIZE_BYTES: ${{ inputs.corpus_nested_archive_size_bytes || vars.DCMVIEW_CORPUS_NESTED_ARCHIVE_SIZE_BYTES }}
      DCMVIEW_CORPUS_RELEASE_MANIFEST_SHA256: ${{ inputs.corpus_release_manifest_sha256 || vars.DCMVIEW_CORPUS_RELEASE_MANIFEST_SHA256 }}
      DCMVIEW_CORPUS_RELEASE_MANIFEST_SIZE_BYTES: ${{ inputs.corpus_release_manifest_size_bytes || vars.DCMVIEW_CORPUS_RELEASE_MANIFEST_SIZE_BYTES }}
      DCMVIEW_CORPUS_INSTALLED_BINARY_SHA256: ${{ inputs.corpus_installed_binary_sha256 || vars.DCMVIEW_CORPUS_INSTALLED_BINARY_SHA256 }}
      DCMVIEW_CORPUS_INSTALLED_BINARY_SIZE_BYTES: ${{ inputs.corpus_installed_binary_size_bytes || vars.DCMVIEW_CORPUS_INSTALLED_BINARY_SIZE_BYTES }}
      DCMVIEW_CORPUS_GENERATOR_TARGET: ${{ inputs.corpus_generator_target || vars.DCMVIEW_CORPUS_GENERATOR_TARGET }}
      DCMVIEW_CORPUS_GENERATOR_TOOLCHAIN: ${{ inputs.corpus_generator_toolchain || vars.DCMVIEW_CORPUS_GENERATOR_TOOLCHAIN }}
      DCMVIEW_CORPUS_GENERATOR_FEATURES: ${{ inputs.corpus_generator_features || vars.DCMVIEW_CORPUS_GENERATOR_FEATURES }}
      DCMVIEW_CORPUS_RUNTIME_IDENTITIES_SHA256: ${{ inputs.corpus_runtime_identities_sha256 || vars.DCMVIEW_CORPUS_RUNTIME_IDENTITIES_SHA256 }}
      DCMVIEW_CORPUS_DEFINITION_MANIFEST_SHA256: ${{ inputs.corpus_definition_manifest_sha256 || vars.DCMVIEW_CORPUS_DEFINITION_MANIFEST_SHA256 }}
      DCMVIEW_CORPUS_DEFINITION_SHA256: ${{ inputs.corpus_definition_sha256 || vars.DCMVIEW_CORPUS_DEFINITION_SHA256 }}
      DCMVIEW_CORPUS_MANIFEST_SHA256: ${{ inputs.corpus_manifest_sha256 || vars.DCMVIEW_CORPUS_MANIFEST_SHA256 }}
      DCMVIEW_CORPUS_MANIFEST_SIZE_BYTES: ${{ inputs.corpus_manifest_size_bytes || vars.DCMVIEW_CORPUS_MANIFEST_SIZE_BYTES }}
      DCMVIEW_CORPUS_PROFILE: ${{ inputs.corpus_profile || vars.DCMVIEW_CORPUS_PROFILE }}
      DCMVIEW_CORPUS_SEED: ${{ inputs.corpus_seed || vars.DCMVIEW_CORPUS_SEED }}
      DCMVIEW_CORPUS_BINDING_ID: ${{ inputs.corpus_binding_id || vars.DCMVIEW_CORPUS_BINDING_ID }}
      DCMVIEW_CORPUS_ARCHIVE_SHA256: ${{ inputs.corpus_archive_sha256 || vars.DCMVIEW_CORPUS_ARCHIVE_SHA256 }}
      DCMVIEW_CORPUS_ARCHIVE_SIZE_BYTES: ${{ inputs.corpus_archive_size_bytes || vars.DCMVIEW_CORPUS_ARCHIVE_SIZE_BYTES }}
      DCMVIEW_CORPUS_GENERATOR_VERSION: ${{ inputs.corpus_generator_version || vars.DCMVIEW_CORPUS_GENERATOR_VERSION }}
      DCMVIEW_CORPUS_ARTIFACT_TOKEN: ${{ secrets.DCMVIEW_COMPAT_CORPUS_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: Download the immutable producer artifact
        shell: bash
        run: |
          set -euo pipefail
          required=(
            DCMVIEW_CORPUS_ARTIFACT_REPOSITORY DCMVIEW_CORPUS_ARTIFACT_WORKFLOW
            DCMVIEW_CORPUS_ARTIFACT_RUN_ID DCMVIEW_CORPUS_ARTIFACT_ID
            DCMVIEW_CORPUS_ARTIFACT_DIGEST DCMVIEW_CORPUS_GENERATOR_REVISION
            DCMVIEW_CORPUS_ACTIONS_ZIP_SHA256 DCMVIEW_CORPUS_ACTIONS_ZIP_SIZE_BYTES
            DCMVIEW_CORPUS_NESTED_ARCHIVE_SHA256 DCMVIEW_CORPUS_NESTED_ARCHIVE_SIZE_BYTES
            DCMVIEW_CORPUS_RELEASE_MANIFEST_SHA256 DCMVIEW_CORPUS_RELEASE_MANIFEST_SIZE_BYTES
            DCMVIEW_CORPUS_INSTALLED_BINARY_SHA256 DCMVIEW_CORPUS_INSTALLED_BINARY_SIZE_BYTES
            DCMVIEW_CORPUS_GENERATOR_TARGET DCMVIEW_CORPUS_GENERATOR_TOOLCHAIN
            DCMVIEW_CORPUS_GENERATOR_FEATURES DCMVIEW_CORPUS_RUNTIME_IDENTITIES_SHA256
            DCMVIEW_CORPUS_DEFINITION_MANIFEST_SHA256 DCMVIEW_CORPUS_DEFINITION_SHA256
            DCMVIEW_CORPUS_MANIFEST_SHA256 DCMVIEW_CORPUS_MANIFEST_SIZE_BYTES
            DCMVIEW_CORPUS_PROFILE DCMVIEW_CORPUS_SEED DCMVIEW_CORPUS_BINDING_ID
            DCMVIEW_CORPUS_ARCHIVE_SHA256 DCMVIEW_CORPUS_ARCHIVE_SIZE_BYTES
            DCMVIEW_CORPUS_GENERATOR_VERSION
          )
          for variable in "${required[@]}"; do
            if [[ -z "${!variable:-}" && "$variable" != DCMVIEW_CORPUS_GENERATOR_FEATURES ]]; then
              echo "missing immutable smoke pin: $variable" >&2
              exit 2
            fi
          done
          [[ "$DCMVIEW_CORPUS_ARTIFACT_REPOSITORY" == "beatrice-b-m/dcmview-test-corpus" ]] || { echo "unexpected producer repository" >&2; exit 2; }
          [[ "$DCMVIEW_CORPUS_ARTIFACT_WORKFLOW" == "publish-smoke-artifact.yml" ]] || { echo "unexpected producer workflow" >&2; exit 2; }
          [[ "$DCMVIEW_CORPUS_ARTIFACT_RUN_ID" =~ ^[0-9]+$ ]] || { echo "workflow run ID must be numeric" >&2; exit 2; }
          [[ "$DCMVIEW_CORPUS_ARTIFACT_ID" =~ ^[0-9]+$ ]] || { echo "artifact ID must be numeric" >&2; exit 2; }
          artifact_digest="${DCMVIEW_CORPUS_ARTIFACT_DIGEST#sha256:}"
          [[ "$artifact_digest" =~ ^[0-9a-f]{64}$ ]] || { echo "artifact digest must be SHA-256 (raw or sha256: prefixed)" >&2; exit 2; }
          zip="$RUNNER_TEMP/dcmview-current-smoke.zip"
          api_root="https://api.github.com/repos/${DCMVIEW_CORPUS_ARTIFACT_REPOSITORY}"
          artifact_metadata="$RUNNER_TEMP/dcmview-current-smoke-artifact.json"
          run_metadata="$RUNNER_TEMP/dcmview-current-smoke-run.json"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DCMVIEW_CORPUS_ARTIFACT_TOKEN}" \
            "$api_root/actions/artifacts/${DCMVIEW_CORPUS_ARTIFACT_ID}" --output "$artifact_metadata"
          curl --fail --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DCMVIEW_CORPUS_ARTIFACT_TOKEN}" \
            "$api_root/actions/runs/${DCMVIEW_CORPUS_ARTIFACT_RUN_ID}" --output "$run_metadata"
          python - "$artifact_metadata" "$run_metadata" \
            "$DCMVIEW_CORPUS_ARTIFACT_REPOSITORY" "$DCMVIEW_CORPUS_ARTIFACT_WORKFLOW" \
            "$DCMVIEW_CORPUS_ARTIFACT_RUN_ID" "$DCMVIEW_CORPUS_ARTIFACT_ID" <<'PY'
          import json
          import sys
          from pathlib import Path

          artifact_path, run_path, expected_repository, expected_workflow, expected_run_id, expected_artifact_id = sys.argv[1:]
          artifact = json.loads(Path(artifact_path).read_text(encoding="utf-8"))
          run = json.loads(Path(run_path).read_text(encoding="utf-8"))
          if not isinstance(artifact, dict) or not isinstance(run, dict):
              raise SystemExit("GitHub metadata responses must be JSON objects")

          def numeric(value: object, label: str) -> int:
              if isinstance(value, bool) or not isinstance(value, int):
                  raise SystemExit(f"GitHub metadata {label} is not numeric")
              return value

          expected_run = int(expected_run_id)
          expected_artifact = int(expected_artifact_id)
          if numeric(artifact.get("id"), "artifact ID") != expected_artifact:
              raise SystemExit("GitHub artifact metadata ID does not match the configured artifact ID")
          if numeric(run.get("id"), "workflow run ID") != expected_run:
              raise SystemExit("GitHub workflow run metadata ID does not match the configured run ID")
          workflow_run = artifact.get("workflow_run")
          if not isinstance(workflow_run, dict):
              raise SystemExit("GitHub artifact metadata lacks workflow_run binding")
          if numeric(workflow_run.get("id"), "artifact workflow run ID") != expected_run:
              raise SystemExit("GitHub artifact is not attached to the configured workflow run")
          repository = run.get("repository")
          if not isinstance(repository, dict) or repository.get("full_name") != expected_repository:
              raise SystemExit("GitHub workflow run repository does not match the configured repository")
          if run.get("status") != "completed" or run.get("conclusion") != "success":
              raise SystemExit("configured GitHub workflow run is not completed successfully")
          head_repository = run.get("head_repository")
          if not isinstance(head_repository, dict) or head_repository.get("full_name") != expected_repository:
              raise SystemExit("GitHub workflow run head repository does not match the configured repository")
          default_branch = repository.get("default_branch")
          if not isinstance(default_branch, str) or not default_branch:
              raise SystemExit("GitHub workflow run repository lacks a default branch")
          if run.get("head_branch") != default_branch:
              raise SystemExit("GitHub workflow run head branch is not the repository default branch")
          repository_id = numeric(repository.get("id"), "workflow repository ID")
          if numeric(workflow_run.get("repository_id"), "artifact repository ID") != repository_id:
              raise SystemExit("GitHub artifact repository does not match the configured repository")
          workflow_id = numeric(run.get("workflow_id"), "workflow ID")
          artifact_workflow_id = workflow_run.get("workflow_id")
          if artifact_workflow_id is not None and numeric(artifact_workflow_id, "artifact workflow ID") != workflow_id:
              raise SystemExit("GitHub artifact workflow does not match the configured workflow run")
          expected_path = expected_workflow
          if not expected_path.startswith(".github/workflows/"):
              expected_path = ".github/workflows/" + expected_path
          if run.get("path") != expected_path:
              raise SystemExit("GitHub workflow run path does not match the configured workflow")
          if artifact.get("expired") is not False:
              raise SystemExit("configured GitHub artifact is expired or missing expiry metadata")
          PY
          api="$api_root/actions/artifacts/${DCMVIEW_CORPUS_ARTIFACT_ID}/zip"
          curl --fail --location --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${DCMVIEW_CORPUS_ARTIFACT_TOKEN}" \
            "$api" --output "$zip"
          echo "$artifact_digest  $zip" | sha256sum --check --strict
          python scripts/compatibility/extract_github_artifact.py "$zip" "$RUNNER_TEMP/dcmview-current-smoke"
          test -f "$RUNNER_TEMP/dcmview-current-smoke/smoke.tar.gz"
          test -f "$RUNNER_TEMP/dcmview-current-smoke/artifact-index.json"
      - name: Run the viewer-owned stored-artifact profile
        env:
          DCMVIEW_COMPAT_CORPUS_ROOT: ${{ runner.temp }}/dcmview-current-smoke
          DCMVIEW_COMPAT_OUTPUT: ${{ runner.temp }}/dcmview-compatibility-artifact
        run: python scripts/check.py compatibility-artifact --install
      - name: Upload compatibility evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dcmview-compatibility-artifact-${{ github.run_id }}
          path: ${{ runner.temp }}/dcmview-compatibility-artifact
          if-no-files-found: ignore

  vscode-compile:
    name: VS Code compile
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Compile the VS Code extension
        run: python scripts/check.py vscode --install

  vscode-integration:
    name: VS Code integration (${{ matrix.vscode-version }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - vscode-version: "1.90.2"
            experimental: false
          - vscode-version: "insiders"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: vscode/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run VS Code extension integration
        env:
          DCMVIEW_VSCODE_TEST_VERSION: ${{ matrix.vscode-version }}
        run: xvfb-run -a python scripts/check.py vscode-integration --install

  packaging-smoke:
    name: Python wheel packaging
    needs: changes
    if: needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build manylinux wheel
        run: bash scripts/build_linux_wheel.sh
      - name: Verify wheel name and installed CLI
        run: >
          python scripts/verify_wheel_install.py
          dist
          --expected-platform manylinux_2_28_x86_64
